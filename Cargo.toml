[package]
name = "indexmap"
edition = "2024"
version = "2.14.0"
documentation = "https://docs.rs/indexmap/"
repository = "https://github.com/indexmap-rs/indexmap"
license = "Apache-2.0 OR MIT"
description = "A hash table with consistent order and fast iteration."
keywords = ["hashmap", "no_std"]
categories = ["data-structures", "no-std"]
rust-version = "1.85"

[lib]
bench = false

[dependencies]
equivalent = { version = "1.0", default-features = false }
hashbrown = { version = "0.17", default-features = false }

arbitrary = { version = "1.0", optional = true, default-features = false }
serde_core = { version = "1.0.220", optional = true, default-features = false }
rayon = { version = "1.9", optional = true }
sval = { version = "2", optional = true, default-features = false }

# deprecated: use borsh's "indexmap" feature instead.
borsh = { version = "1.2", optional = true, default-features = false }

# ETNA runner dependencies. Regular deps so src/bin/etna.rs can use them.
quickcheck = { path = "/Users/akeles/Programming/projects/PbtBenchmark/quickcheck", features = ["etna"] }
proptest = "1"
crabcheck = { path = "/Users/akeles/Programming/projects/PbtBenchmark/crabcheck" }
hegeltest = "0.3.7"
rand = "0.9"

# serde v1.0.220 is the first version that released with `serde_core`.
# This is required to avoid conflict with other `serde` users which may require an older version.
[target.'cfg(any())'.dependencies]
serde = { version = "1.0.220", default-features = false, optional = true }

[dev-dependencies]
itertools = "0.14"
fastrand = { version = "2", default-features = false }
fnv = "1.0"
serde = { version = "1.0", default-features = false, features = ["derive"] }

[features]
default = ["std"]
std = []
serde = ["dep:serde_core", "dep:serde"]
# The quickcheck feature gates the `Arbitrary` impls for IndexMap/IndexSet
# in src/arbitrary.rs. The dep itself is now non-optional (needed by the
# etna runner) so this feature no longer lists a dep activation.
quickcheck = []

# for testing only, of course
test_debug = []

[profile.release]
debug = true

[profile.bench]
debug = true

[package.metadata.release]
allow-branch = ["main"]
sign-tag = true
tag-name = "{{version}}"

[package.metadata.docs.rs]
features = ["arbitrary", "quickcheck", "serde", "borsh", "rayon", "sval"]
rustdoc-args = ["--cfg", "docsrs"]

# test-nostd / test-serde / test-sval are out of the workspace for the ETNA
# build — they test no-std / serde configurations that don't interact with
# the property runner and just add noise to `cargo test` timing.
[workspace]
members = []
exclude = ["test-nostd", "test-serde", "test-sval"]

[lints.rust]
private-bounds = "deny"
private-interfaces = "deny"
unnameable-types = "deny"
unreachable-pub = "deny"

# We *mostly* avoid unsafe code, but there are a few fine-grained cases allowed
unsafe-code = "deny"

rust-2018-idioms = "warn"

[lints.clippy]
style = "allow"
